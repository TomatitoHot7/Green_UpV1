<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREENUP - Ranking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="navbar greenup-navbar animate__animated animate__fadeInDown">
        <div class="logo-container">
            <img src="imagenes/4181E3B8-1C13-4848-8590-D15F80325442.png" alt="Logo del grupo" class="img">
            <span>GREENUP</span>
        </div>
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="misiones.html">Misiones</a>
            <a href="dudas.html">Preguntas Frecuentes</a>
            <a href="informacion.html">Información Relevante</a>
            <a href="ranking.html">Ranking</a>
        </div>
        <div class="user-profile-nav">
            <img id="user-avatar" src="imagenes/default-avatar.png" alt="Foto de Perfil" class="profile-img-nav animate__animated animate__pulse" onclick="document.getElementById('file-input').click()">
            <span class="user-level-nav badge bg-success animate__animated animate__fadeIn">Nivel <span id="nav-level">1</span></span>
            <input type="file" id="file-input" style="display: none;" accept="image/*">

            <div class="ecobot-widget" id="ecobot-widget">
                <div id="ecobot-bubble" class="ecobot-bubble"></div>
                <button id="ecobot-avatar" class="ecobot-avatar" aria-label="Asistente Eco">
                    🌱
                    <span id="ecobot-badge" class="ecobot-badge"></span>
                </button>
            </div>
        </div>
    </div>

    <div class="container mt-5 main-content animate__animated animate__fadeIn">
        <h1 class="text-center mb-4">Ranking de Misioneros 🏆</h1>
        <p class="text-center">Ordenado del que tiene menos nivel/XP al que tiene más.</p>

        <div class="card shadow-sm p-3">
            <table class="table table-striped align-middle mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Usuario</th>
                        <th>Nivel</th>
                        <th>Experiencia</th>
                    </tr>
                </thead>
                <tbody id="ranking-body">
                    <tr><td colspan="4" class="text-center">Cargando ranking...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
    <script src="ranking.js"></script>
</body>
</html>
